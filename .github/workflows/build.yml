name: Test and build DSM preview packages
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: python3 tools/build.py --arch ${{ matrix.arch }} --build-runtime --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: SynoVPN-${{ matrix.arch }}-preview
          path: dist/*
