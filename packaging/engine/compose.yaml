services:
  vpn:
    build: .
    image: synovpn-engine:0.5.0-9
    container_name: synovpn-engine
    user: "0:0"
    network_mode: host
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, NET_ADMIN, NET_RAW, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      - /var/packages/SynoVPN/etc:/bootstrap:ro
      - engine-state:/var/lib/synovpn-engine
    mem_limit: 256m
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  engine-state:
    name: synovpn-engine-state
